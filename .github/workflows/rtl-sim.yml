# Run the RTL testbenches that already exist in rtl/sim/ on every push.
#
# These benches ship with ModelSim .do runners, and ModelSim is not installed on
# the dev machine -- so in practice they were never run, including through an
# entire session of changes to sdram_ctrl.v. Icarus runs both of these fine, so
# there is no reason for them to be manual.
#
# Nine of the ten bench directories in rtl/sim/ run here. rtl/sim/chipset is the
# holdout -- it is ModelSim-only and has not been ported to Icarus. Add benches
# as they are confirmed to run rather than committing a red pipeline.
#
# The first two steps are gates rather than benches: a standalone parse of every
# synthesisable source, and an assertion that the CIA CNT revert is still in
# place. Both exist because the pipeline should refuse things that people would
# otherwise have to remember.
name: rtl-sim

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog and GHDL
        run: sudo apt-get update && sudo apt-get install -y iverilog ghdl

      # Parse every synthesisable source standalone. Nothing else in this
      # workflow ever parses Minimig.sv, and most of rtl/ is never parsed at
      # all, so a plain syntax error otherwise passes CI in full and surfaces
      # only 18 seconds into a 35-minute Quartus fit. Seconds of runtime, and it
      # fails the cheap way. See syntax_check.sh for what it does and does not
      # treat as an error.
      - name: Verilog syntax gate
        run: |
          set -euo pipefail
          bash syntax_check.sh

      # The CIA CNT revert is permanent and will be re-applied on every future
      # Minimig-AGA sync, so it needs a control rather than a memory.
      #
      # Upstream b013ce3 added the Timer A/B INMODE count-source selects but not
      # the wiring: minimig.v drives both CIAs with .cnt_in(1'b1), so cnt_rise
      # never pulses and selecting a CNT source stops the timer dead. It broke
      # Flink. Reverted 2026-08-27, and again 2026-08-31 when a merge brought it
      # back -- forgotten once already, between two syncs five days apart.
      #
      # The failure is near-silent: a title starts and then hangs with every
      # data path healthy, which is the hardest possible thing to attribute.
      #
      # If this step fails, do NOT delete it as stale. It means a merge has
      # re-applied b013ce3. Re-revert rtl/cia_timera.v and rtl/cia_timerb.v to
      # the eclk forms below, or wire CNT properly first.
      - name: CIA count source is eclk (guards the b013ce3 revert)
        run: |
          set -euo pipefail
          fail=0
          grep -qF "assign count = eclk;" rtl/cia_timera.v || {
            echo "rtl/cia_timera.v: timer A count source is not the eclk form"; fail=1; }
          grep -qF "assign count = tmcr[6] ? tmra_ovf : eclk;" rtl/cia_timerb.v || {
            echo "rtl/cia_timerb.v: timer B count source is not the eclk form"; fail=1; }
          if [ "$fail" -ne 0 ]; then
            echo
            echo "The CIA CNT revert has been undone. See the comment above this"
            echo "step in .github/workflows/rtl-sim.yml before changing anything."
            exit 1
          fi

      # sdram_ctrl's chip-read burst path, store-to-load forwarding and byte-enable
      # merging. Waits on dut.sdram_state == 0, so it also covers the registered
      # state decode that the sd_addr retiming introduced -- a wrong decode means
      # the CHIP slot never loads chipAddr and the baseline reads come back garbage.
      - name: SDRAM store-to-load forwarding
        run: |
          set -euo pipefail
          cd rtl/sim/sdram
          # ModelSim needs declaration-before-use; this regenerates the reordered
          # copy from the real sdram_ctrl.v. Behaviour-identical, sim only.
          python3 make_sim_sdram.py
          iverilog -g2012 -o tb_fwd \
            dpram_sim.v ../../cpu_cache_new.v sdram_ctrl_sim.v tb_sdram_fwd.sv
          vvp tb_fwd | tee out.log
          grep -q "RUN: PASS" out.log

      # cpu_cache_new's fill-vs-snoop interlock. sdram_ctrl drives snoop_act from
      # chipWE, so a change to the chip write path shows up here.
      - name: Cache fill/snoop interlock
        run: |
          set -euo pipefail
          cd rtl/sim/cache
          iverilog -g2012 -o tb_snoop \
            dpram_sim.v ../../cpu_cache_new.v tb_cache_snoop.sv
          vvp tb_snoop | tee out.log
          grep -q "RUN: PASS" out.log

      # hps_ext's save state diagnostic sub-channel (UIO class 0xF600). Drives
      # EXT_BUS the way sys/hps_io.sv does and checks the word order and class
      # decode against the real module, because the byte_cnt alignment the host
      # poller depends on is a convention that appears nowhere in the source.
      - name: hps_ext save state diagnostics
        run: |
          set -euo pipefail
          cd rtl/sim/hps_ext
          iverilog -g2012 -o tb_ssdiag ../../../hps_ext.v tb_hps_ext_ssdiag.sv
          vvp tb_ssdiag | tee out.log
          grep -q "RUN: PASS" out.log

      # cdtv_bridge's CR-511 command/reply surface and TPI Port C shapes. Ten
      # checks, including the 2026-05-21 byte-lane fix and the mode-0 Port C
      # value that a pre-fix bug got wrong.
      #
      # These two benches shipped with ModelSim .do runners and were never run
      # here, so they silently stopped compiling at the b265a3b merge: it moved
      # the command stream onto the ext bus and deleted ac_rom_*, cmd_in_*,
      # cmd_out_*, sec_byte_* and trace_* from the module. Being in CI is the
      # point -- the RTL they cover is the CDTV path, which is the part of this
      # core that is hardest to exercise by hand.
      - name: CDTV CR-511 command surface
        run: |
          set -euo pipefail
          cd rtl/sim/cdtv
          iverilog -g2012 -o tb_cr511 -s tb_cdtv_cr511             tb_cdtv_cr511.sv ../../cdtv_bridge.v ../cache/dpram_sim.v
          vvp tb_cr511 | tee out_cr511.log
          grep -q "RUN: PASS" out_cr511.log

      # The STCH interrupt path, including the raise-versus-AIR-read collision
      # across twelve phase offsets. STCH must fire only on cd_media
      # transitions; an earlier FSM pulsed it on every command and regressed the
      # M1 splash, which is the class of error this catches.
      - name: CDTV TPI STCH delivery
        run: |
          set -euo pipefail
          cd rtl/sim/cdtv
          iverilog -g2012 -o tb_tpi -s tb_cdtv_tpi_stch             tb_cdtv_tpi_stch.sv ../../cdtv_bridge.v ../cache/dpram_sim.v
          vvp tb_tpi | tee out_tpi.log
          grep -q "RUN: PASS" out_tpi.log

      # agnus_beamcounter's light pen latch. VPOSR/VHPOSR used to be a plain mux
      # on the userspace-supplied position, so BPLCON0 bit 3 froze the beam
      # counters for as long as it stayed set and every beam-wait loop hung --
      # with no gun connected they froze at zero, so it hung with no light pen
      # in the room. The bench counts distinct VHPOSR values across a frame;
      # against the old code that count is 1.
      - name: Light pen latch
        run: |
          set -euo pipefail
          cd rtl/sim/lightpen
          iverilog -g2012 -o tb ../../agnus_beamcounter.v tb_lightpen_latch.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # HBSTRT and HBSTOP carry half-a-colour-clock position in bit 10, which the
      # core used to drop. Also asserts that bits 9:8 stay dropped -- they are 35 ns
      # resolution and hpos cannot express them, so a future change that folds them
      # into the compare would move the blanking edge by a whole colour clock.
      - name: Programmable horizontal blanking edges
        run: |
          set -euo pipefail
          cd rtl/sim/beamcounter
          iverilog -g2012 -o tb ../../agnus_beamcounter.v tb_beamcounter_hblank.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # TG68KdotC_Kernel's savestate restore. VHDL, so GHDL rather than Icarus.
      # The bench boots the kernel from reset vectors, freezes it at 80
      # successive clocks across one pass of a test program, restores the whole
      # architectural state through the ss_* write ports and checks that the
      # CPU comes back at the restored PC. Without ss_resume only a fifth of
      # those freeze points survive, which is the bug this covers; the run
      # prints the per-freeze-point map either way.
      #
      # Runs from the repo root: the testbench opens its program image by a
      # path relative to the working directory.
      - name: TG68K savestate restore
        run: |
          set -euo pipefail
          bash rtl/sim/tg68k/run.sh

      # The save state register bus through the real minimig: the snoop tap,
      # the replay mux, the replay's register-decode tick and the memory map
      # bits. This is the only bench that elaborates minimig.v itself, so it is
      # also the only one that can see whether a replay actually lands in
      # agnus, paula and denise rather than merely appearing on their pins.
      # Both bugs it was written to look for were real: nothing landed at all
      # while the machine was frozen, and agnus ignored the mux entirely
      # because it decodes the register address it generates itself.
      - name: Save state register bus through minimig
        run: |
          set -euo pipefail
          bash rtl/sim/ssmux/run.sh

      # Akiko's savestate ports: the idle rule that lets the state vector leave
      # the staging buffers out, the capture-side bit offsets, and a full
      # capture/reset/restore round trip. Needs the dpram model under
      # rtl/sim/cache/, because akiko_nvram.v instantiates bram.vhd's dpram and
      # Icarus has no VHDL -- which is why the rest of the akiko benches are
      # still ModelSim-only.
      - name: Akiko save state
        run: |
          set -euo pipefail
          iverilog -g2012 -I. -o tb_akiko_ss             rtl/akiko.v rtl/akiko_nvram.v             rtl/sim/cache/dpram_sim.v rtl/sim/akiko/tb_akiko_savestate.sv
          vvp tb_akiko_ss | tee out_akiko_ss.log
          grep -q "RUN: PASS" out_akiko_ss.log

      # The Akiko sector channel itself: 1176 words in, 2352 bytes out, at
      # three different strobe spacings. This is upstream's bench for the
      # word-wide ingest, run here against our akiko.v with the savestate
      # ports on it.
      - name: Akiko sector ingest
        run: |
          set -euo pipefail
          iverilog -g2012 -I. -o tb_sec_ingest             rtl/akiko.v rtl/akiko_nvram.v rtl/akiko_hps_bridge.v             rtl/sim/cache/dpram_sim.v rtl/sim/akiko/tb_akiko_sec_ingest.sv
          vvp tb_sec_ingest | tee out_sec_ingest.log
          grep -q "tb_akiko_sec_ingest PASS" out_sec_ingest.log

      # Where each memory region lands in SDRAM. The savestate names chip RAM,
      # slow RAM and the Kickstart by the address sdram_ctrl's CPU port expects,
      # which is not the CPU address -- gary, the bank mapper and the sram
      # bridge between them drop CPU bit 23 and remap two of the three regions.
      # A wrong base reads the wrong memory into the file and writes it back
      # over the right memory, and nothing else in the suite would notice.
      - name: SDRAM region map
        run: |
          set -euo pipefail
          iverilog -g2012 -o tb_membank             rtl/minimig_bankmapper.v rtl/minimig_sram_bridge.v             rtl/sim/membank/tb_membank_map.sv
          vvp tb_membank | tee out_membank.log
          grep -q "RUN: PASS" out_membank.log
